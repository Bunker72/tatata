<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Il sito da consultazione</title>
    <style>
        body {
            background-color: #DEEAF6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0 80px;
            box-sizing: border-box;
            display: none;
        }

        h1 {
            color: red;
            text-align: center;
        }

        hr {
            border: none;
            border-top: 2px solid gray;
            height: 0;
            width: 100%;
            margin: 20px 0;
            box-sizing: content-box;
        }

        h2 {
            font-style: italic;
        }

        #editable-text {
            width: 100%;
            min-height: 200px;
            max-width: 100%;
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            overflow: auto;
            resize: none;
            display: none;
            font-size: 16px;
            word-wrap: break-word;
        }

        #editable-text img {
            max-width: 100%;
            height: auto;
        }

        #editable-text:focus {
            outline: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <h1>MICROBIOLOGIA DEGLI ALIMENTI</h1>
    <hr>
    <h2>Testo:</h2>
    <div id="editable-text" contenteditable="true"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Config Firebase
const firebaseConfig = {
    apiKey: "AIzaSyArxR7bv96i4_vr6UPli0w-L_Q2Gv-qy1U",
    authDomain: "salvataggio-testo-8a71b.firebaseapp.com",
    projectId: "salvataggio-testo-8a71b",
    storageBucket: "salvataggio-testo-8a71b.firebasestorage.app",
    messagingSenderId: "1069514262117",
    appId: "1:1069514262117:web:f9c4bdef9c84b30b15688c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// PASSWORD
const password = "BNK-3R";
const userPassword = prompt("Inserisci la password per modificare il testo:");

if(userPassword === password){
    document.body.style.display = "block";
    const editable = document.getElementById("editable-text");
    editable.style.display = "block";
    const docRef = doc(db, "contenuti", "microbiologia");

    // Debounce per salvataggio
    let saveTimeout;
    function scheduleSave() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            setDoc(docRef, { testo: editable.innerHTML });
        }, 800);
    }

    // Regola altezza del div
    function adjustHeight() {
        editable.style.height = 'auto';
        editable.style.height = editable.scrollHeight + 'px';
    }

    // Carica contenuto iniziale
    async function loadText() {
        const docSnap = await getDoc(docRef);
        if(docSnap.exists()){
            editable.innerHTML = docSnap.data().testo || "";
        }
        adjustHeight();
    }

    // Gestione incolla
    editable.addEventListener("paste", function(e){
        e.preventDefault();
        const clipboardData = (e.clipboardData || window.clipboardData);
        const pastedData = clipboardData.getData('text/html') || clipboardData.getData('text/plain');
        document.execCommand("insertHTML", false, pastedData);
        adjustHeight();
        scheduleSave();
    });

    // Input modifiche
    editable.addEventListener("input", function(){
        adjustHeight();
        scheduleSave();
    });

    // Aggiornamento in tempo reale senza sovrascrivere contenuto in editing
    onSnapshot(docRef, (docSnap)=>{
        if(docSnap.exists()){
            const newContent = docSnap.data().testo || "";
            if(newContent !== editable.innerHTML && document.activeElement !== editable){
                editable.innerHTML = newContent;
                adjustHeight();
            }
        }
    });

    window.addEventListener("load", loadText);

} else {
    alert("Password errata! Non puoi modificare il testo.");
}
</script>
</body>
</html>
