<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Il sito da consultazione</title>
<style>
    body {
        background-color: #DEEAF6;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0 80px;
        box-sizing: border-box;
        display: none;
    }

    h1 { color: red; text-align: center; }
    hr { border: none; border-top: 2px solid gray; margin: 20px 0; }
    h2 { font-style: italic; }

    #editable-text {
        width: 100%;
        min-height: 200px;
        max-width: 100%;
        background-color: #ffffff;
        border: 2px solid #000000;
        border-radius: 10px;
        padding: 15px;
        box-sizing: border-box;
        overflow: hidden;
        resize: none;
        display: none;
        font-size: 16px;
        position: relative;
        line-height: 1.4em;
        white-space: pre-wrap; /* mantiene line break */
        word-wrap: break-word;
    }

    #editable-text:focus { outline: none; }

    /* Evidenziazione animata modifiche */
    .highlight-remote {
        background-color: #ffff99;
        transition: background-color 1s ease;
    }
    .highlight-local {
        background-color: #cce5ff;
        transition: background-color 0.8s ease;
    }

    /* Barre cursori remoti */
    .cursor-remote {
        position: absolute;
        width: 2px;
        animation: blink 1s step-start 0s infinite;
        pointer-events: none;
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 600px) { body { padding: 0 20px; } }
</style>
</head>
<body>

<h1>MICROBIOLOGIA DEGLI ALIMENTI</h1>
<hr>
<h2>Testo:</h2>
<div id="editable-text" contenteditable="true"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyArxR7bv96i4_vr6UPli0w-L_Q2Gv-qy1U",
    authDomain: "salvataggio-testo-8a71b.firebaseapp.com",
    projectId: "salvataggio-testo-8a71b",
    storageBucket: "salvataggio-testo-8a71b.firebasestorage.app",
    messagingSenderId: "1069514262117",
    appId: "1:1069514262117:web:f9c4bdef9c84b30b15688c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const password = "BNK-3R";
const userPassword = prompt("Inserisci la password per modificare il testo:");

if(userPassword === password){
    document.body.style.display = "block";
    const editable = document.getElementById("editable-text");
    editable.style.display = "block";

    const docRef = doc(db,"contenuti","microbiologia");
    const cursorsCol = collection(db,"cursori");
    const userId = "user-" + Math.floor(Math.random()*1000000);
    const userColor = "#"+((1<<24)*Math.random()|0).toString(16);

    function adjustHeight(){ editable.style.height='auto'; editable.style.height=editable.scrollHeight+'px'; }

    async function loadText(){
        const docSnap = await getDoc(docRef);
        if(docSnap.exists()){ editable.innerText = docSnap.data().testo; adjustHeight(); }
    }

    async function saveText(){
        await setDoc(docRef,{testo:editable.innerText,password:password});
        await setDoc(docRef,{testo:editable.innerText});
    }

    function highlightChanges(oldText,newText,type){
        let start = 0;
        while(start<oldText.length && start<newText.length && oldText[start]===newText[start]) start++;
        let endOld=oldText.length-1, endNew=newText.length-1;
        while(endOld>=start && endNew>=start && oldText[endOld]===newText[endNew]){ endOld--; endNew--; }

        const changedText = newText.slice(start,endNew+1);
        editable.innerHTML = newText.slice(0,start) + `<span class="${type}">${changedText}</span>` + newText.slice(endNew+1);

        setTimeout(()=>{ editable.innerText = newText; }, type==='highlight-remote'?800:400);
    }

    // Sincronizzazione testo in tempo reale
    onSnapshot(docRef,(docSnap)=>{
        if(docSnap.exists()){
            const serverText = docSnap.data().testo;
            if(editable.innerText !== serverText){
                highlightChanges(editable.innerText,serverText,'highlight-remote');
                adjustHeight();
            }
        }
    });

    // Evidenziazione modifiche locali
    editable.addEventListener("input", ()=>{
        saveText(); adjustHeight();
        highlightChanges(editable.innerText,editable.innerText,'highlight-local');
        updateCursor();
    });

    // Funzione per aggiornare cursore locale
    async function updateCursor(){
        const selection = window.getSelection();
        const pos = selection.focusOffset;
        await setDoc(doc(db,"cursori",userId),{position:pos,colore:userColor});
    }

    editable.addEventListener("keyup", updateCursor);
    editable.addEventListener("click", updateCursor);

    // Rendering cursori remoti
    onSnapshot(cursorsCol,(snapshot)=>{
        document.querySelectorAll(".cursor-remote").forEach(e=>e.remove());

        snapshot.docs.forEach(docSnap=>{
            if(docSnap.id!==userId){
                const data = docSnap.data();
                const span = document.createElement("div");
                span.className="cursor-remote";
                span.style.backgroundColor = data.colore;

                const range = document.createRange();
                const textNode = editable.firstChild || editable;
                const pos = Math.min(data.position, textNode.length);
                range.setStart(textNode, pos);
                range.collapse(true);

                const rect = range.getBoundingClientRect();
                span.style.top = (rect.top - editable.getBoundingClientRect().top + editable.scrollTop) + "px";
                span.style.left = (rect.left - editable.getBoundingClientRect().left + editable.scrollLeft) + "px";
                span.style.height = rect.height + "px";

                editable.appendChild(span);
            }
        });
    });

    window.addEventListener("load", loadText);

}else{ alert("Password errata! Non puoi modificare il testo."); }

</script>
</body>
</html>
