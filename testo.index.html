<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Il sito da consultazione</title>
    <style>
        body {
            background-color: #DEEAF6; /* sfondo azzurro */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0 80px; /* margini laterali come secondo codice */
            box-sizing: border-box;
            display: none; /* nasconde tutto inizialmente */
        }

        h1 {
            color: red;
            text-align: center;
        }

        hr {
            border: none;
            border-top: 2px solid gray; /* linea uniforme */
            height: 0;
            width: 100%;
            margin: 20px 0;
            box-sizing: content-box;
        }

        h2 {
            font-style: italic; /* sottotitoli in italico */
        }

        /* Riquadro modificabile */
        #editable-text {
            width: 100%;
            min-height: 200px;
            max-width: 100%;
            background-color: #ffffff; /* sfondo bianco */
            border: 2px solid #000000; /* bordo nero */
            border-radius: 10px; /* angoli stondati */
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden; /* elimina scroll interni */
            resize: none; /* impedisce ridimensionamento manuale */
            display: none; /* nascosto inizialmente */
            font-size: 16px;
        }

        #editable-text:focus {
            outline: none;
        }

        /* Responsive per schermi piccoli */
        @media (max-width: 600px) {
            body {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <h1>MICROBIOLOGIA DEGLI ALIMENTI</h1>
    <hr>

    <h2>Testo:</h2>
    <div id="editable-text" contenteditable="true"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Configurazione Firebase
const firebaseConfig = {
    apiKey: "AIzaSyArxR7bv96i4_vr6UPli0w-L_Q2Gv-qy1U",
    authDomain: "salvataggio-testo-8a71b.firebaseapp.com",
    projectId: "salvataggio-testo-8a71b",
    storageBucket: "salvataggio-testo-8a71b.firebasestorage.app",
    messagingSenderId: "1069514262117",
    appId: "1:1069514262117:web:f9c4bdef9c84b30b15688c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// PASSWORD per modificare
const password = "BNK-3R";
const userPassword = prompt("Inserisci la password per modificare il testo:");

if (userPassword === password) {
  document.body.style.display = "block";
  const editable = document.getElementById("editable-text");
  editable.style.display = "block";

  const docRef = doc(db, "contenuti", "microbiologia");

  // Funzione per aggiornare altezza
  function adjustHeight() {
    editable.style.height = 'auto';
    editable.style.height = editable.scrollHeight + 'px';
  }

  // Carica testo iniziale
  async function loadText() {
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      editable.innerText = docSnap.data().testo;
      adjustHeight();
    }
  }

  // Salvataggio immediato su Firestore
  async function saveText() {
    await setDoc(docRef, { testo: editable.innerText, password: password });
  }

  // Sincronizzazione in tempo reale
  const unsubscribe = onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const serverText = docSnap.data().testo;
      if (editable.innerText !== serverText) {
        editable.innerText = serverText;
        adjustHeight();
      }
    }
  });

  // Evento input: salva subito
  editable.addEventListener("input", function() {
    saveText();
    adjustHeight();
  });

  window.addEventListener("load", loadText);

} else {
  alert("Password errata! Non puoi modificare il testo.");
}
</script>
</body>
</html>
